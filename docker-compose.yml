services:
  # ---- Always-on services ----

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbguru-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/database_guru.db
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - REDIS_URL=${REDIS_URL:-}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - FILE_UPLOAD_DIR=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dbguru-data:/app/data
      - dbguru-uploads:/app/uploads
      - dbguru-logs:/app/logs
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbguru-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp/nginx:size=1m
      - /var/cache/nginx:size=128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

  # ---- Profile: ollama (bundled LLM) ----

  ollama:
    image: ollama/ollama:0.6
    container_name: dbguru-ollama
    profiles:
      - ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dbguru

  ollama-pull:
    image: ollama/ollama:0.6
    container_name: dbguru-ollama-pull
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:latest}"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - dbguru

  # ---- Profile: full (PostgreSQL + Redis) ----

  postgres:
    image: postgres:16-alpine
    container_name: dbguru-postgres
    profiles:
      - full
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbguru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env when using the full profile}
      POSTGRES_DB: ${POSTGRES_DB:-database_guru}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /run/postgresql:size=16m
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dbguru

  redis:
    image: redis:7-alpine
    container_name: dbguru-redis
    profiles:
      - full
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env when using the full profile}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

volumes:
  dbguru-data:
  dbguru-uploads:
  dbguru-logs:
  ollama-models:
  postgres-data:
  redis-data:

networks:
  dbguru:
    driver: bridge
