services:
  # ---- Always-on services ----

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbguru-backend
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/database_guru.db
      - FILE_UPLOAD_DIR=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dbguru-data:/app/data
      - dbguru-uploads:/app/uploads
      - dbguru-logs:/app/logs
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbguru-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp/nginx:size=1m,uid=1001,gid=1001
      - /var/cache/nginx:size=128m,uid=1001,gid=1001
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

  # ---- Profile: ollama (bundled LLM) ----

  ollama:
    image: ollama/ollama:0.6
    container_name: dbguru-ollama
    profiles:
      - ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dbguru

  ollama-pull:
    image: ollama/ollama:0.6
    container_name: dbguru-ollama-pull
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:latest}"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - dbguru

  # ---- Profile: full (PostgreSQL + Redis) ----

  postgres:
    image: postgres:16-alpine
    container_name: dbguru-postgres
    profiles:
      - full
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbguru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_before_production}
      POSTGRES_DB: ${POSTGRES_DB:-database_guru}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /run/postgresql:size=16m
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dbguru

  redis:
    image: redis:7-alpine
    container_name: dbguru-redis
    profiles:
      - full
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_before_production}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_before_production}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - dbguru

  # ---- Profile: graph (Phase 25 — Neo4j) ----
  # Bring up with: docker compose --profile graph up -d
  # Spec §16 — bundled Neo4j 5 community for local development & integration tests.

  neo4j:
    image: neo4j:5-community
    container_name: dbguru-neo4j
    profiles:
      - graph
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    ports:
      - "127.0.0.1:7474:7474"     # HTTP UI
      - "127.0.0.1:7687:7687"     # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - dbguru

  # ---- Profile: observability (Phase 24) ----
  # Bring up with: docker compose --profile observability up -d
  # Backend stays reachable even if any of these fail to start.

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: dbguru-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - dbguru

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: dbguru-prometheus
    profiles:
      - observability
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - dbguru

  grafana:
    image: grafana/grafana:10.4.5
    container_name: dbguru-grafana
    profiles:
      - observability
    ports:
      - "127.0.0.1:3001:3000"     # 3001 to avoid the frontend on :3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - dbguru

volumes:
  dbguru-data:
  dbguru-uploads:
  dbguru-logs:
  ollama-models:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  grafana-data:

networks:
  dbguru:
    driver: bridge
